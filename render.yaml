services:
  - type: web
    name: tdr-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://tdr-frontend-bg3h.onrender.com,http://localhost:3000,http://localhost:5173
